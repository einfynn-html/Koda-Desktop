<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datei-Explorer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --accent-color: #3b82f6;
            --text-main: #F8F9FA;
            --text-sub: #B2B6BA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            display: flex; height: 100vh; width: 100vw;
            overflow: hidden; background: transparent; color: var(--text-main); user-select: none;
        }

        .explorer-sidebar {
            width: 220px; min-width: 220px; background: rgba(0, 0, 0, 0.25);
            border-right: 1px solid rgba(255,255,255,0.06); padding: 16px 12px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .sidebar-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 4px; color: var(--text-sub); font-size: 0.9rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
        .sidebar-item.active { background: rgba(255, 255, 255, 0.14); color: var(--text-main); border-left: 3px solid var(--accent-color); }

        .explorer-content { flex-grow: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.05); }

        .explorer-header {
            padding: 14px 20px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
        }

        .header-actions { display: flex; gap: 10px; align-items: center; }
        
        .upload-btn {
            background: var(--accent-color); color: #fff; border: none; padding: 6px 12px;
            border-radius: 4px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .upload-btn:hover { filter: brightness(1.1); }

        .file-grid {
            padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px; overflow-y: auto; align-content: start; flex-grow: 1;
        }

        .file-card {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 6px; cursor: pointer; transition: all 0.2s; position: relative; text-align: center;
        }
        .file-card:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.18); transform: translateY(-2px); }
        
        .file-preview {
            width: 100%; height: 90px; margin-bottom: 10px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: rgba(0,0,0,0.2);
        }
        .file-preview img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .text-preview {
            background: #fff; color: #222; font-size: 7px; padding: 6px;
            align-items: flex-start; justify-content: flex-start; text-align: left;
            word-break: break-word; line-height: 1.3; font-family: monospace;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }

        .file-name { font-size: 0.82rem; font-weight: 500; word-break: break-word; color: var(--text-main); line-height: 1.2; width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        .file-actions { display: flex; gap: 6px; margin-top: 10px; width: 100%; justify-content: center; }
        .file-btn {
            border: none; background: rgba(255,255,255,0.1); color: #fff; padding: 5px;
            border-radius: 3px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; flex-grow: 1;
        }
        .file-btn:hover { background: var(--accent-color); }
        .file-btn.del:hover { background: #ef4444; }

        .empty-state { grid-column: 1 / -1; text-align: center; color: var(--text-sub); margin-top: 40px; font-size: 0.9rem; }

        /* Bildvorschau Modal-Fenster */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-window {
            background: #1e1e24; border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 85vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            padding: 10px 16px; background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 600; font-size: 0.9rem; color: var(--text-main);
        }
        .modal-close {
            background: none; border: none; color: var(--text-sub);
            font-size: 1.3rem; cursor: pointer; padding: 0 4px; line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #ef4444; }
        .modal-body {
            padding: 16px; display: flex; align-items: center; justify-content: center;
            overflow: auto; background: rgba(0, 0, 0, 0.3);
        }
        .modal-body img {
            max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 4px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <div class="explorer-sidebar">
        <div class="sidebar-item active" id="nav-desktop" onclick="setFolder('desktop')">🖥️ Desktop</div>
        <div class="sidebar-item" id="nav-documents" onclick="setFolder('documents')">📁 Dokumente</div>
        <div class="sidebar-item" id="nav-images" onclick="setFolder('images')">🖼️ Bilder</div>
    </div>

    <div class="explorer-content">
        <div class="explorer-header">
            <span id="currentFolderName">🖥️ Desktop</span>
            <div class="header-actions">
                <input type="file" id="fileUpload" accept="image/*, text/*, .html" style="display: none;" onchange="handleFileUpload(event)" multiple>
                <button class="upload-btn" onclick="document.getElementById('fileUpload').click()">+ Hochladen</button>
            </div>
        </div>
        <div class="file-grid" id="fileGrid"></div>
    </div>

    <!-- Modal für Bildvorschau -->
    <div class="modal-overlay" id="imageModal" onclick="closeImageModal()">
        <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modalTitle">Bildvorschau</span>
                <button class="modal-close" onclick="closeImageModal()">&times;</button>
            </div>
            <div class="modal-body">
                <img id="modalImg" src="" alt="Vorschau">
            </div>
        </div>
    </div>

    <script>
        let currentFolder = 'desktop';

        function loadFiles() {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = '';
            const allFiles = JSON.parse(localStorage.getItem('os_vfs_v1') || '[]');
            const folderFiles = allFiles.filter(f => f.folder === currentFolder);

            if (folderFiles.length === 0) {
                grid.innerHTML = `<div class="empty-state">Dieser Ordner ist leer. Lade Dateien hoch oder speichere eine Notiz.</div>`;
                return;
            }

            folderFiles.forEach(f => {
                const card = document.createElement('div');
                card.className = 'file-card';
                card.ondblclick = () => openFile(f.id);

                let previewHTML = '';
                const isImg = f.type === 'image' || (f.content && f.content.startsWith('data:image'));

                if (isImg) {
                    previewHTML = `<div class="file-preview"><img src="${f.content}" alt="Vorschau" loading="lazy"></div>`;
                } else {
                    let textContent = f.content || '';
                    let strippedText = textContent.replace(/<[^>]*>?/gm, '').substring(0, 120);
                    if(strippedText.trim() === '') strippedText = "Leeres Dokument";
                    previewHTML = `<div class="file-preview text-preview">${strippedText}</div>`;
                }

                card.innerHTML = `
                    ${previewHTML}
                    <div class="file-name" title="${f.name}">${f.name}</div>
                    <div class="file-actions">
                        <button class="file-btn" onclick="event.stopPropagation(); downloadFile('${f.id}')" title="Download">⬇️</button>
                        <button class="file-btn" onclick="event.stopPropagation(); openFile('${f.id}')" title="Öffnen / Vorschau">👁️</button>
                        <button class="file-btn del" onclick="event.stopPropagation(); deleteFile('${f.id}')" title="Löschen">✕</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setFolder(folder) {
            currentFolder = folder;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${folder}`).classList.add('active');
            
            const titles = {
                'desktop': '🖥️ Desktop',
                'documents': '📁 Dokumente',
                'images': '🖼️ Bilder'
            };
            document.getElementById('currentFolderName').textContent = titles[folder];
            loadFiles();
        }

        function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            let vfs = JSON.parse(localStorage.getItem('os_vfs_v1') || '[]');

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    const isImage = file.type.startsWith('image/');
                    
                    const newFile = {
                        id: 'file_' + Date.now() + Math.random().toString(36).substr(2, 9),
                        name: file.name,
                        content: content,
                        folder: currentFolder,
                        type: isImage ? 'image' : 'text'
                    };
                    
                    vfs.push(newFile);
                    localStorage.setItem('os_vfs_v1', JSON.stringify(vfs));
                    loadFiles();
                    
                    window.parent.postMessage({ type: 'fileSaved' }, '*');
                };
                
                if (file.type.startsWith('image/')) {
                    reader.readAsDataURL(file);
                } else {
                    reader.readAsText(file);
                }
            });
            
            event.target.value = '';
        }

        function deleteFile(id) {
            let files = JSON.parse(localStorage.getItem('os_vfs_v1') || '[]');
            const fileToDelete = files.find(f => f.id == id);
            
            files = files.filter(f => f.id != id);
            localStorage.setItem('os_vfs_v1', JSON.stringify(files));
            loadFiles();

            if (fileToDelete) {
                window.parent.postMessage({ type: 'fileDeleted', filename: fileToDelete.name }, '*');
            }
            window.parent.postMessage({ type: 'fileSaved' }, '*');
        }

        function downloadFile(id) {
            const files = JSON.parse(localStorage.getItem('os_vfs_v1') || '[]');
            const file = files.find(f => f.id == id);
            if (!file) return;

            const a = document.createElement('a');
            a.download = file.name;

            if (file.type === 'image' || (file.content && file.content.startsWith('data:image'))) {
                a.href = file.content;
            } else {
                const blob = new Blob([file.content], { type: 'text/html' });
                a.href = URL.createObjectURL(blob);
            }
            
            a.click();
        }

        function openFile(id) {
            const files = JSON.parse(localStorage.getItem('os_vfs_v1') || '[]');
            const file = files.find(f => f.id == id);
            if (!file) return;

            const isImg = file.type === 'image' || (file.content && file.content.startsWith('data:image'));

            if (isImg) {
                // Sende Event an übergeordnetes OS falls Bildbetrachter-App existiert
                window.parent.postMessage({ type: 'openImage', file: file }, '*');
                window.parent.postMessage({ type: 'openImageViewer', file: file }, '*');

                // Öffne integriertes Bildvorschau-Fenster
                openImageModal(file);
            } else {
                // Öffne Text- und HTML-Dateien in der Notizen-App
                window.parent.postMessage({ type: 'openInNotes', file: file }, '*');
            }
        }

        function openImageModal(file) {
            document.getElementById('modalTitle').textContent = file.name || 'Bildvorschau';
            document.getElementById('modalImg').src = file.content;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
            document.getElementById('modalImg').src = '';
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'themeUpdate') {
                document.documentElement.style.setProperty('--accent-color', e.data.theme.accentColor);
            } else if (e.data && e.data.type === 'refreshFiles') {
                loadFiles();
            }
        });

        loadFiles();
    </script>
</body>
</html>
