<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Desktop OS - Modern Redesign</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            var(--main-bg): linear-gradient(135deg, #0f1115 0%, #1f242d 100%);
            --glass-base: #111315;
            --glass-opacity: 0.70;
            --glass-blur: 24px;
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
            --accent-color: #3b82f6;
            --text-main: #F8F9FA;
            --text-sub: #B2B6BA;
            --ui-radius: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            height: 100vh; width: 100vw;
            overflow: hidden;
            background: var(--main-bg);
            background-size: cover; background-position: center;
            background-attachment: fixed; background-repeat: no-repeat;
            display: flex; flex-direction: column;
            user-select: none; color: var(--text-main);
            transition: background 0.6s ease;
        }

        /* --- SPERRBILDSCHIRM --- */
        #loginScreen {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(30px);
            z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .login-box {
            background: rgba(20, 22, 26, 0.85);
            padding: 40px 36px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            width: 380px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }
        .login-box h2 { margin-bottom: 8px; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.5px; }
        .login-box p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 14px 18px;
            border-radius: 4px; border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4); color: #fff;
            font-size: 1rem; outline: none; text-align: center;
            transition: all 0.2s; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .login-box input:focus { border-color: var(--accent-color); background: rgba(0, 0, 0, 0.6); }
        .login-box button {
            margin-top: 20px; width: 100%; padding: 14px;
            border-radius: 4px; background: var(--accent-color);
            color: #fff; font-weight: 600; font-size: 1rem;
            border: none; cursor: pointer; transition: all 0.2s;
        }
        .login-box button:hover { filter: brightness(1.15); box-shadow: 0 6px 16px rgba(0,0,0,0.3); }

        /* --- CLOCK --- */
        .clock-wrapper {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            text-align: center; cursor: pointer; padding: 12px 24px;
            border-radius: 4px; transition: all 0.3s ease; z-index: 10;
        }
        .clock-wrapper:hover { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); }
        #clock { font-size: 4rem; font-weight: 300; letter-spacing: -2px; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #date { font-size: 1.05rem; font-weight: 500; color: rgba(255,255,255,0.85); margin-top: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        /* --- DESKTOP ICONS --- */
        .desktop { flex-grow: 1; position: relative; padding: 130px 30px 100px 30px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
        .icon {
            width: 90px; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; padding: 10px; border-radius: 4px; transition: all 0.2s ease;
        }
        .icon:hover { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(8px); transform: translateY(-2px); }
        .icon-img {
            width: 56px; height: 56px;
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
            margin-bottom: 8px; display: flex; justify-content: center; align-items: center;
            font-size: 26px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        }
        .icon-text { font-size: 0.85rem; font-weight: 500; text-shadow: 0 2px 6px rgba(0,0,0,0.9); text-align: center; }

        /* --- MODERN FLOATING DOCK --- */
        .dock-container {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; padding: 8px 14px;
            background: rgba(12, 14, 18, var(--glass-opacity));
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 6px; z-index: 10000;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
        }
        .dock-container.hidden-dock {
            transform: translateX(-50%) translateY(150%);
            opacity: 0;
            pointer-events: none;
        }
        .dock-item {
            display: flex; align-items: center; gap: 8px; padding: 8px 14px;
            border-radius: 4px; border: 1px solid transparent; background: transparent;
            color: var(--text-main); font-size: 0.95rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s ease;
        }
        .dock-item:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .dock-icon { font-size: 1.2rem; }

        /* --- FENSTER SYSTEM --- */
        .app-window {
            position: absolute; width: 880px; height: 600px; top: 80px; left: 150px;
            background: var(--glass-base);
            background-color: color-mix(in srgb, var(--glass-base) calc(var(--glass-opacity) * 100%), transparent);
            backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: var(--ui-radius);
            box-shadow: var(--glass-shadow);
            display: flex; flex-direction: column; overflow: hidden;
            z-index: 100; transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
            opacity: 1; transform: scale(1);
        }
        .app-window.hidden { opacity: 0; transform: scale(0.96); pointer-events: none; }
        .app-window.fullscreen {
            top: 8px !important; left: 8px !important;
            width: calc(100vw - 16px) !important; height: calc(100vh - 16px) !important;
            border-radius: 4px !important;
        }

        .window-header {
            height: 42px; padding: 0 12px;
            background: rgba(0, 0, 0, 0.35); border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex; align-items: center; justify-content: space-between; cursor: grab; position: relative;
        }
        .window-header:active { cursor: grabbing; }
        
        .window-title {
            font-weight: 600; font-size: 0.9rem; color: var(--text-main);
            display: flex; align-items: center; gap: 8px; pointer-events: none;
        }
        
        .window-controls { display: flex; gap: 4px; align-items: center; }
        .win-btn {
            width: 28px; height: 26px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255, 255, 255, 0.05); color: var(--text-sub); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
            transition: all 0.2s ease;
        }
        .win-btn:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
        .win-btn.close:hover { background: #ef4444; color: #fff; border-color: #ef4444; }

        .window-body { flex-grow: 1; overflow: hidden; color: var(--text-main); display: flex; }

        .snap-preview { position: fixed; background: rgba(255, 255, 255, 0.08); border: 2px solid var(--accent-color); backdrop-filter: blur(12px); border-radius: 4px; pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.2s, top 0.2s, left 0.2s, width 0.2s, height 0.2s; }
        .snap-preview.visible { opacity: 1; }

        /* --- SETTINGS APP --- */
        .settings-content { padding: 24px; width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .settings-card { background: rgba(0, 0, 0, 0.25); border-radius: 6px; padding: 20px; border: 1px solid rgba(255,255,255,0.06); }
        .settings-section-title { font-size: 1.05rem; font-weight: 600; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        .setting-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 12px 14px; border-radius: 4px; transition: 0.2s; }
        .setting-row:hover { background: rgba(255, 255, 255, 0.06); }
        .setting-row label { font-size: 0.9rem; font-weight: 500; color: var(--text-main); }
        .setting-row.full-width { grid-column: span 2; flex-direction: column; align-items: flex-start; gap: 10px; }
        
        input[type="range"] { accent-color: var(--accent-color); cursor: pointer; height: 5px; border-radius: 2px; background: rgba(255,255,255,0.1); outline: none; -webkit-appearance: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--accent-color); border-radius: 2px; cursor: pointer; }
        
        input[type="color"] { border: none; background: transparent; cursor: pointer; width: 36px; height: 36px; border-radius: 4px; padding: 0; overflow: hidden; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; }
        
        select.ui-select, input.ui-input {
            width: 100%; padding: 12px 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4); color: var(--text-main); outline: none; font-size: 0.9rem; transition: 0.2s;
        }
        select.ui-select:focus, input.ui-input:focus { border-color: var(--accent-color); background: rgba(0,0,0,0.6); }
        select.ui-select option { background: #1a1c23; color: #fff; }
        
        .file-upload-btn {
            background: rgba(255,255,255,0.04); border: 2px dashed rgba(255,255,255,0.18);
            padding: 14px; width: 100%; text-align: center; border-radius: 4px; cursor: pointer;
            transition: all 0.2s; font-size: 0.9rem; font-weight: 500; color: var(--text-sub);
        }
        .file-upload-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--accent-color); color: var(--text-main); }
        input[type="file"] { display: none; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 2px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="loginScreen">
        <div class="login-box">
            <h2 id="loginTitle">System gesperrt</h2>
            <p id="loginDesc">Bitte Master-Passwort eingeben</p>
            <input type="password" id="loginPwd" placeholder="Passwort..." onkeypress="handleLoginKey(event)">
            <button id="loginBtn" onclick="handleLogin()">Entsperren</button>
        </div>
    </div>

    <!-- Snap Preview Overlay -->
    <div class="snap-preview" id="snapPreview"></div>

    <!-- Desktop Area -->
    <div class="clock-wrapper" onclick="toggleWindow('settingsWindow')">
        <div id="clock">00:00</div>
        <div id="date">Laden...</div>
    </div>

    <div class="desktop">
        <div class="icon" onclick="toggleWindow('settingsWindow')">
            <div class="icon-img">⚙️</div>
            <div class="icon-text">System</div>
        </div>
        <div class="icon" onclick="toggleWindow('notesWindow')">
            <div class="icon-img">📝</div>
            <div class="icon-text">Notizen</div>
        </div>
    </div>

    <!-- Modern Floating Dock -->
    <div class="dock-container">
        <button class="dock-item" onclick="toggleWindow('settingsWindow')">
            <span class="dock-icon">⚙️</span> Settings
        </button>
        <button class="dock-item" onclick="toggleWindow('notesWindow')">
            <span class="dock-icon">📝</span> Notes
        </button>
    </div>

    <!-- NOTIZEN FENSTER (Lädt notes.html) -->
    <div class="app-window hidden" id="notesWindow">
        <div class="window-header" onmousedown="startDrag(event, 'notesWindow')">
            <div class="window-title">📝 Notizen</div>
            <div class="window-controls">
                <button class="win-btn full" onclick="toggleFullscreen('notesWindow')" title="Vollbild">▢</button>
                <button class="win-btn close" onclick="toggleWindow('notesWindow')" title="Schließen">✕</button>
            </div>
        </div>
        <div class="window-body" style="padding: 0; display: block;">
            <iframe id="notesFrame" src="notes.html" style="width: 100%; height: 100%; border: none; background: transparent;" allowtransparency="true"></iframe>
        </div>
    </div>

    <!-- EINSTELLUNGEN FENSTER -->
    <div class="app-window hidden" id="settingsWindow">
        <div class="window-header" onmousedown="startDrag(event, 'settingsWindow')">
            <div class="window-title">⚙️ System-Einstellungen</div>
            <div class="window-controls">
                <button class="win-btn full" onclick="toggleFullscreen('settingsWindow')" title="Vollbild">▢</button>
                <button class="win-btn close" onclick="toggleWindow('settingsWindow')" title="Schließen">✕</button>
            </div>
        </div>
        <div class="window-body">
            <div class="settings-content">
                <div class="settings-card">
                    <div class="settings-section-title">🖼️ KI-Hintergründe & Themes</div>
                    <div class="setting-grid">
                        <div class="setting-row full-width">
                            <label>Design-Preset auswählen</label>
                            <select class="ui-select" id="themePresetSelect" onchange="applyPreset()">
                                <option value="original">Original Dark Minimalist</option>
                                <option value="abstract">Generative Waves (KI)</option>
                                <option value="cyberpunk">Cyberpunk Neon (KI)</option>
                                <option value="forest">Mystic Forest (KI)</option>
                                <option value="space">Deep Cosmic Space (KI)</option>
                            </select>
                        </div>
                        <div class="setting-row full-width">
                            <label>Hintergrundbild (URL)</label>
                            <input type="text" class="ui-input" id="customBgUrl" placeholder="https://..." onchange="handleUrlUpload()">
                        </div>
                        <div class="setting-row full-width">
                            <label class="file-upload-btn">
                                📁 Eigenes lokales Bild hochladen (max. 50 MB)
                                <input type="file" id="customBgFile" accept="image/*" onchange="handleFileUpload(event)">
                            </label>
                        </div>
                    </div>
                </div>

                <div class="settings-card">
                    <div class="settings-section-title">🎨 Personalisierung</div>
                    <div class="setting-grid">
                        <div class="setting-row">
                            <label>Hintergrund Farbe 1</label>
                            <input type="color" id="pickerBg1" onchange="updateColorsManually()">
                        </div>
                        <div class="setting-row">
                            <label>Hintergrund Farbe 2</label>
                            <input type="color" id="pickerBg2" onchange="updateColorsManually()">
                        </div>
                        <div class="setting-row">
                            <label>Fenster-Glas Basis</label>
                            <input type="color" id="pickerGlass" onchange="updateCustomTheme()">
                        </div>
                        <div class="setting-row">
                            <label>Akzentfarbe</label>
                            <input type="color" id="pickerAccent" onchange="updateCustomTheme()">
                        </div>
                    </div>
                </div>

                <div class="settings-card">
                    <div class="settings-section-title">✨ Effekte & Transparenz</div>
                    <div class="setting-grid">
                        <div class="setting-row">
                            <label>Glas-Deckkraft</label>
                            <input type="range" min="0.1" max="0.95" step="0.05" id="sliderOpacity" oninput="updateCustomTheme()">
                        </div>
                        <div class="setting-row">
                            <label>Unschärfe (Blur)</label>
                            <input type="range" min="0" max="50" step="2" id="sliderBlur" oninput="updateCustomTheme()">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // KI-GENERIERTE SVGs & THEME MANAGER
        const SVG_BG = {
            original: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%230f1115'/><stop offset='50%25' stop-color='%231b1e24'/><stop offset='100%25' stop-color='%232a2e37'/></linearGradient><linearGradient id='acc' x1='0%25' y1='100%25' x2='100%25' y2='0%25'><stop offset='0%25' stop-color='%233b82f6' stop-opacity='0.2'/><stop offset='100%25' stop-color='%238b5cf6' stop-opacity='0.03'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23bg)'/><polygon points='0,1080 1920,300 1920,1080' fill='url(%23acc)'/></svg>",
            abstract: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='g1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23090d16'/><stop offset='50%25' stop-color='%23161233'/><stop offset='100%25' stop-color='%230d1b2a'/></linearGradient><linearGradient id='w1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%233b82f6' stop-opacity='0.4'/><stop offset='100%25' stop-color='%238b5cf6' stop-opacity='0.1'/></linearGradient><linearGradient id='w2' x1='100%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%23ec4899' stop-opacity='0.3'/><stop offset='100%25' stop-color='%2306b6d4' stop-opacity='0.1'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23g1)'/><path d='M 0,300 Q 450,100 900,500 T 1800,400 L 1920,1080 L 0,1080 Z' fill='url(%23w1)'/><path d='M 0,600 Q 600,900 1200,400 T 1920,700 L 1920,1080 L 0,1080 Z' fill='url(%23w2)'/></svg>",
            cyberpunk: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='cbg' x1='0%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%230a0518'/><stop offset='60%25' stop-color='%23260a3a'/><stop offset='100%25' stop-color='%23000000'/></linearGradient><linearGradient id='sun' x1='0%25' y1='0%25' x2='0%25' y2='100%25'><stop offset='0%25' stop-color='%23f43f5e'/><stop offset='100%25' stop-color='%23eab308'/></linearGradient></defs><rect width='100%25' height='100%25' fill='url(%23cbg)'/><circle cx='960' cy='540' r='200' fill='url(%23sun)' opacity='0.8'/><path d='M0 540 L1920 540' stroke='%23f43f5e' stroke-width='2'/><path d='M0 620 L1920 620 M0 720 L1920 720 M0 840 L1920 840 M0 980 L1920 980' stroke='%23a855f7' stroke-width='1.5' opacity='0.35'/></svg>",
            forest: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><linearGradient id='fbg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2304160d'/><stop offset='50%25' stop-color='%230a2e1d'/><stop offset='100%25' stop-color='%23020c07'/></linearGradient><radialGradient id='light' cx='70%25' cy='20%25' r='60%25'><stop offset='0%25' stop-color='%2310b981' stop-opacity='0.3'/><stop offset='100%25' stop-color='%23000000' stop-opacity='0'/></radialGradient></defs><rect width='100%25' height='100%25' fill='url(%23fbg)'/><rect width='100%25' height='100%25' fill='url(%23light)'/></svg>",
            space: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080' viewBox='0 0 1920 1080'><defs><radialGradient id='s1' cx='30%25' cy='40%25' r='50%25'><stop offset='0%25' stop-color='%230284c7' stop-opacity='0.35'/><stop offset='100%25' stop-color='%23000000' stop-opacity='0'/></radialGradient><radialGradient id='s2' cx='70%25' cy='60%25' r='50%25'><stop offset='0%25' stop-color='%236366f1' stop-opacity='0.3'/><stop offset='100%25' stop-color='%23000000' stop-opacity='0'/></radialGradient></defs><rect width='100%25' height='100%25' fill='%23030712'/><rect width='100%25' height='100%25' fill='url(%23s1)'/><rect width='100%25' height='100%25' fill='url(%23s2)'/></svg>"
        };

        const PRESETS = {
            "original": { mainBg: `url("${SVG_BG.original}")`, bgGrad1: "#0f1115", bgGrad2: "#2a2e37", glassBase: "#111315", accentColor: "#3b82f6", glassOpacity: "0.70", glassBlur: "24" },
            "abstract": { mainBg: `url("${SVG_BG.abstract}")`, bgGrad1: "#090d16", bgGrad2: "#0d1b2a", glassBase: "#121824", accentColor: "#8b5cf6", glassOpacity: "0.65", glassBlur: "28" },
            "cyberpunk": { mainBg: `url("${SVG_BG.cyberpunk}")`, bgGrad1: "#0a0518", bgGrad2: "#260a3a", glassBase: "#0d071b", accentColor: "#f43f5e", glassOpacity: "0.70", glassBlur: "18" },
            "forest": { mainBg: `url("${SVG_BG.forest}")`, bgGrad1: "#04160d", bgGrad2: "#0a2e1d", glassBase: "#071c12", accentColor: "#10b981", glassOpacity: "0.65", glassBlur: "24" },
            "space": { mainBg: `url("${SVG_BG.space}")`, bgGrad1: "#030712", bgGrad2: "#0f172a", glassBase: "#080e1a", accentColor: "#0ea5e9", glassOpacity: "0.60", glassBlur: "20" }
        };

        let currentTheme = { ...PRESETS["original"] };

        function loadSavedTheme() {
            const saved = JSON.parse(localStorage.getItem('os_theme_v3'));
            if (saved) currentTheme = { ...currentTheme, ...saved };
            updateUIFromTheme(currentTheme);
            applyTheme(currentTheme);
        }

        function updateUIFromTheme(t) {
            document.getElementById('pickerBg1').value = t.bgGrad1 || "#0f1115";
            document.getElementById('pickerBg2').value = t.bgGrad2 || "#2a2e37";
            document.getElementById('pickerGlass').value = t.glassBase;
            document.getElementById('pickerAccent').value = t.accentColor;
            document.getElementById('sliderOpacity').value = t.glassOpacity;
            document.getElementById('sliderBlur').value = t.glassBlur;
            
            if(t.mainBg && t.mainBg.startsWith("url") && !t.mainBg.includes("data:image/svg+xml")) {
                document.getElementById('customBgUrl').value = t.mainBg.replace("url('", "").replace("')", "").replace('url("', '').replace('")', '');
            } else { document.getElementById('customBgUrl').value = ""; }
        }

        function applyPreset() {
            const presetKey = document.getElementById('themePresetSelect').value;
            if (PRESETS[presetKey]) {
                currentTheme = { ...PRESETS[presetKey] };
                updateUIFromTheme(currentTheme); applyTheme(currentTheme); saveTheme();
            }
        }

        function updateColorsManually() {
            const bg1 = document.getElementById('pickerBg1').value;
            const bg2 = document.getElementById('pickerBg2').value;
            currentTheme.mainBg = `linear-gradient(135deg, ${bg1} 0%, ${bg2} 100%)`;
            currentTheme.bgGrad1 = bg1; currentTheme.bgGrad2 = bg2;
            document.getElementById('customBgUrl').value = "";
            updateCustomTheme();
        }

        function handleUrlUpload() {
            const url = document.getElementById('customBgUrl').value.trim();
            if (url) { currentTheme.mainBg = `url('${url}')`; updateCustomTheme(); }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0]; if (!file) return;
            const MAX_SIZE = 50 * 1024 * 1024;
            if (file.size > MAX_SIZE) {
                alert("Die Datei ist zu groß. Die maximale Dateigröße beträgt 50 MB.");
                e.target.value = ""; return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 1920; let width = img.width; let height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
                    try {
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                        currentTheme.mainBg = `url('${dataUrl}')`;
                        document.getElementById('customBgUrl').value = "Lokales Bild aktiv";
                        updateCustomTheme();
                    } catch(err) { alert("Fehler beim Verarbeiten des Bildes."); }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function updateCustomTheme() {
            currentTheme.glassBase = document.getElementById('pickerGlass').value;
            currentTheme.glassOpacity = document.getElementById('sliderOpacity').value;
            currentTheme.glassBlur = document.getElementById('sliderBlur').value;
            currentTheme.accentColor = document.getElementById('pickerAccent').value;
            applyTheme(currentTheme); saveTheme();
        }

        function applyTheme(t) {
            const root = document.documentElement;
            root.style.setProperty('--main-bg', t.mainBg);
            root.style.setProperty('--glass-base', t.glassBase);
            root.style.setProperty('--glass-opacity', t.glassOpacity);
            root.style.setProperty('--glass-blur', `${t.glassBlur}px`);
            root.style.setProperty('--accent-color', t.accentColor);

            // Synchronisiere Theme mit der eingebetteten Notizen-App
            const frame = document.getElementById('notesFrame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'themeUpdate', theme: t }, '*');
            }
        }

        function saveTheme() {
            try { localStorage.setItem('os_theme_v3', JSON.stringify(currentTheme)); } 
            catch(e) { alert("Speicherlimit des Browsers erreicht."); }
        }

        // KRYPTO & LOGIN
        const SALT = "CleanDesktopOS_SecureSalt_v3";
        let cryptoKey = null;

        async function generateKey(pwd) {
            const enc = new TextEncoder();
            const keyMat = await crypto.subtle.importKey("raw", enc.encode(pwd), {name: "PBKDF2"}, false, ["deriveBits", "deriveKey"]);
            cryptoKey = await crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: enc.encode(SALT), iterations: 100000, hash: "SHA-256" },
                keyMat, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
            );
        }

        async function encryptText(txt) {
            if(!cryptoKey) return txt;
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const enc = new TextEncoder().encode(txt);
            const cipher = await crypto.subtle.encrypt({name: "AES-GCM", iv}, cryptoKey, enc);
            const combined = new Uint8Array(12 + cipher.byteLength);
            combined.set(iv, 0); combined.set(new Uint8Array(cipher), 12);
            let bin = ''; combined.forEach(b => bin += String.fromCharCode(b)); return btoa(bin);
        }

        async function decryptText(b64) {
            if(!cryptoKey || !b64) return b64;
            try {
                if (!/^[a-zA-Z0-9+/]+={0,2}$/.test(b64)) return b64;
                const bin = atob(b64); const combined = new Uint8Array(bin.length);
                for(let i=0; i<bin.length; i++) combined[i] = bin.charCodeAt(i);
                if(combined.length < 12) return b64;
                const iv = combined.slice(0, 12); const cipher = combined.slice(12);
                const dec = await crypto.subtle.decrypt({name: "AES-GCM", iv}, cryptoKey, cipher);
                return new TextDecoder().decode(dec);
            } catch(e) { return b64; }
        }

        window.onload = () => {
            loadSavedTheme();
            if (!localStorage.getItem('os_locked_v3')) {
                document.getElementById('loginDesc').innerText = 'Lege ein neues Master-Passwort fest.';
                document.getElementById('loginBtn').innerText = 'Einrichten';
            }
            setTimeout(() => { document.getElementById('loginScreen').style.opacity = '1'; }, 100);
        };

        function handleLoginKey(e) { if(e.key === 'Enter') handleLogin(); }

        async function handleLogin() {
            const pwd = document.getElementById('loginPwd').value; if(!pwd) return;
            await generateKey(pwd);
            if (!localStorage.getItem('os_locked_v3')) {
                localStorage.setItem('os_locked_v3', await encryptText("OS_VERIFIED")); unlockSystem(pwd);
            } else {
                if (await decryptText(localStorage.getItem('os_locked_v3')) === "OS_VERIFIED") {
                    unlockSystem(pwd);
                } else { alert("Falsches Passwort!"); document.getElementById('loginPwd').value = ''; }
            }
        }

        function unlockSystem(pwd) {
            const screen = document.getElementById('loginScreen');
            screen.style.transform = 'scale(1.03)'; screen.style.opacity = '0';
            setTimeout(() => { screen.style.display = 'none'; }, 500);

            // Übergebe das Passwort sicher an den iFrame, damit die Notizen-App entschlüsseln kann
            const frame = document.getElementById('notesFrame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'unlock', pwd: pwd }, '*');
            }
        }

        // WINDOW MANAGER
        function checkDockVisibility() {
            const hasFullscreen = document.querySelectorAll('.app-window.fullscreen:not(.hidden)').length > 0;
            const dock = document.querySelector('.dock-container');
            if (hasFullscreen) dock.classList.add('hidden-dock'); else dock.classList.remove('hidden-dock');
        }

        let actWin = null, oX = 0, oY = 0;
        function toggleWindow(id) { 
            const w = document.getElementById(id);
            if (w.classList.contains('hidden')) { w.classList.remove('hidden'); bringToFront(w); } 
            else { w.classList.add('hidden'); }
            checkDockVisibility();
        }
        function toggleFullscreen(id) { document.getElementById(id).classList.toggle('fullscreen'); checkDockVisibility(); }
        function bringToFront(w) { document.querySelectorAll('.app-window').forEach(el => el.style.zIndex = 100); w.style.zIndex = 101; }

        function startDrag(e, id) {
            actWin = document.getElementById(id); bringToFront(actWin);
            if (actWin.classList.contains('fullscreen')) actWin.classList.remove('fullscreen');
            oX = e.clientX - actWin.offsetLeft; oY = e.clientY - actWin.offsetTop;
            document.addEventListener('mousemove', onDrag); document.addEventListener('mouseup', stopDrag);
        }
        function onDrag(e) {
            if (!actWin) return;
            actWin.style.left = `${Math.max(0, e.clientX - oX)}px`; actWin.style.top = `${Math.max(0, e.clientY - oY)}px`;
            const s = document.getElementById('snapPreview');
            const dockH = 80;
            if (e.clientY < 15) { s.style.inset = `8px 8px 8px 8px`; s.classList.add('visible'); }
            else if (e.clientX < 15) { s.style.inset = `8px 50vw ${dockH}px 8px`; s.classList.add('visible'); }
            else if (e.clientX > window.innerWidth - 15) { s.style.inset = `8px 8px ${dockH}px 50vw`; s.classList.add('visible'); }
            else s.classList.remove('visible');
        }
        function stopDrag(e) {
            document.getElementById('snapPreview').classList.remove('visible');
            const dockH = 80;
            if (actWin) {
                if (e.clientY < 15) actWin.classList.add('fullscreen');
                else if (e.clientX < 15) { actWin.style.top='8px'; actWin.style.left='8px'; actWin.style.width='calc(50vw - 12px)'; actWin.style.height=`calc(100vh - ${dockH}px)`; }
                else if (e.clientX > window.innerWidth - 15) { actWin.style.top='8px'; actWin.style.left='50vw'; actWin.style.width='calc(50vw - 12px)'; actWin.style.height=`calc(100vh - ${dockH}px)`; }
            }
            actWin = null; document.removeEventListener('mousemove', onDrag); document.removeEventListener('mouseup', stopDrag);
            checkDockVisibility();
        }

        // UHRZEIT
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000); updateClock();

        // Übertrage initiales Theme an die Notizen-App sobald sie bereit ist
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'notesReady') {
                const frame = document.getElementById('notesFrame');
                if (frame && frame.contentWindow) {
                    frame.contentWindow.postMessage({ type: 'themeUpdate', theme: currentTheme }, '*');
                }
            }
        });
    </script>
</body>
