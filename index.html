<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datei-Explorer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --accent-color: #3b82f6;
            --text-main: #F8F9FA;
            --text-sub: #B2B6BA;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            display: flex; height: 100vh; width: 100vw;
            overflow: hidden; color: var(--text-main); user-select: none;
            /* Hintergrund-Eigenschaften hinzugefügt */
            background-color: #121212;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
        }

        .explorer-sidebar {
            width: 220px; min-width: 220px; background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255,255,255,0.06); padding: 16px 12px;
            display: flex; flex-direction: column; gap: 8px;
            backdrop-filter: blur(10px); /* Leichtes Blur für besseren Look mit Hintergrundbild */
        }

        .sidebar-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 4px; color: var(--text-sub); font-size: 0.9rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
        }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.15); color: var(--text-main); }
        .sidebar-item.active { background: rgba(255, 255, 255, 0.2); color: var(--text-main); border-left: 3px solid var(--accent-color); }

        .sidebar-bottom-actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

        .btn-bg-sidebar {
            background: rgba(59, 130, 246, 0.2); color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4); padding: 10px 12px; border-radius: 4px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-bg-sidebar:hover { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

        .btn-danger-sidebar {
            background: rgba(239, 68, 68, 0.2); color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4); padding: 10px 12px; border-radius: 4px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-danger-sidebar:hover { background: var(--danger-color); color: #fff; border-color: var(--danger-color); }

        .explorer-content { flex-grow: 1; display: flex; flex-direction: column; background: rgba(0,0,0,0.2); backdrop-filter: blur(5px); }

        .explorer-header {
            padding: 14px 20px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 1rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
        }

        .upload-btn {
            background: var(--accent-color); color: #fff; border: none; padding: 6px 12px;
            border-radius: 4px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .upload-btn:hover { filter: brightness(1.1); }

        .file-grid {
            padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px; overflow-y: auto; align-content: start; flex-grow: 1;
        }

        .file-card {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; cursor: pointer; transition: all 0.2s; position: relative; text-align: center;
        }
        .file-card:hover { background: rgba(0, 0, 0, 0.6); border-color: rgba(255, 255, 255, 0.3); transform: translateY(-2px); }
        
        .file-preview {
            width: 100%; height: 90px; margin-bottom: 10px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
            background: rgba(0,0,0,0.5);
        }
        .file-preview img { width: 100%; height: 100%; object-fit: cover; }
        .text-preview {
            background: #fff; color: #222; font-size: 7px; padding: 6px;
            align-items: flex-start; justify-content: flex-start; text-align: left;
            word-break: break-word; line-height: 1.3; font-family: monospace;
        }

        .file-name { font-size: 0.82rem; font-weight: 500; word-break: break-word; color: var(--text-main); line-height: 1.2; width: 100%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        
        .file-actions { display: flex; gap: 6px; margin-top: 10px; width: 100%; justify-content: center; }
        .file-btn {
            border: none; background: rgba(255,255,255,0.1); color: #fff; padding: 5px;
            border-radius: 3px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; flex-grow: 1;
        }
        .file-btn:hover { background: var(--accent-color); }
        .file-btn.del:hover { background: #ef4444; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 99999;
        }
        .modal-box {
            background: #181a20; border: 1px solid rgba(255,255,255,0.15); padding: 24px;
            border-radius: 8px; width: 340px; display: flex; flex-direction: column; gap: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
        .modal-btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
        .modal-input {
            width: 100%; padding: 10px 12px; border-radius: 4px; background: #22252e;
            color: #fff; border: 1px solid rgba(255,255,255,0.15); outline: none; font-size: 0.9rem;
        }
        .modal-input:focus { border-color: var(--accent-color); }
        .step-badge { font-size: 0.75rem; background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .modal-btn { background: var(--accent-color); color: #fff; font-weight: 600; font-size: 0.85rem; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .modal-btn.secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
        
        .divider { text-align: center; font-size: 0.8rem; color: var(--text-sub); margin: 5px 0; position: relative; }
        .divider::before, .divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: rgba(255,255,255,0.1); }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
    </style>
</head>
<body>

    <div class="explorer-sidebar">
        <div class="sidebar-item active" id="nav-desktop" onclick="setFolder('desktop')">🖥️ Desktop</div>
        <div class="sidebar-item" id="nav-documents" onclick="setFolder('documents')">📁 Dokumente</div>
        <div class="sidebar-item" id="nav-images" onclick="setFolder('images')">🖼️ Bilder</div>
        
        <div class="sidebar-bottom-actions">
            <button class="btn-bg-sidebar" onclick="openBgModal()">⚙️ Hintergrund</button>
            <button class="btn-danger-sidebar" onclick="openDeleteEverythingModal()">⚠️ Alles löschen</button>
        </div>
    </div>

    <div class="explorer-content">
        <div class="explorer-header">
            <span id="currentFolderName">🖥️ Desktop</span>
            <div class="header-actions">
                <input type="file" id="fileUpload" accept="image/*, text/*, .html" style="display: none;" onchange="handleFileUpload(event)" multiple>
                <button class="upload-btn" onclick="document.getElementById('fileUpload').click()">+ Hochladen</button>
            </div>
        </div>
        <div class="file-grid" id="fileGrid"></div>
    </div>

    <!-- HINTERGRUND MODAL -->
    <div class="modal-overlay" id="bgModal" style="display: none;">
        <div class="modal-box">
            <div class="modal-title">🖼️ Hintergrund ändern</div>
            <p style="font-size:0.85rem; color:var(--text-sub);">Füge eine Bild-URL ein oder lade ein lokales Bild hoch.</p>
            
            <input type="text" id="bgUrlInput" class="modal-input" placeholder="https://beispiel.de/bild.jpg">
            
            <div class="divider">ODER</div>
            
            <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="handleBgFileUpload(event)">
            <button class="modal-btn secondary" onclick="document.getElementById('bgFileInput').click()" style="width: 100%;">📁 Lokales Bild auswählen</button>

            <div class="modal-btn-row" style="margin-top: 10px;">
                <button class="modal-btn" style="background:#ef4444; margin-right: auto;" onclick="removeBackground()">Entfernen</button>
                <button class="modal-btn secondary" onclick="closeBgModal()">Abbrechen</button>
                <button class="modal-btn" onclick="saveBgUrl()">Speichern</button>
            </div>
        </div>
    </div>

    <!-- DELETE EVERYTHING MODAL (3-STUFIG) -->
    <div class="modal-overlay" id="deleteModal" style="display: none;">
        <div class="modal-box">
            <div class="modal-title">
                <span>⚠️ Alles löschen</span>
                <span class="step-badge" id="deleteStepBadge">1 / 3</span>
            </div>
            <p style="font-size:0.85rem; color:var(--text-sub);" id="deletePromptText">
                Bitte gib dein Passwort ein, um die Zurücksetzung einzuleiten.
            </p>
            <input type="password" id="deletePasswordInput" class="modal-input" placeholder="Passwort eingeben..." onkeydown="if(event.key==='Enter') processDeleteStep()">
            <div class="modal-btn-row">
                <button class="modal-btn secondary" onclick="closeDeleteEverythingModal()">Abbrechen</button>
                <button class="modal-btn" style="background:#ef4444;" onclick="processDeleteStep()" id="deleteConfirmBtn">Weiter (1/3)</button>
            </div>
        </div>
    </div>

    <script>
        let currentFolder = 'desktop';

        // --- HINTERGRUND LOGIK ---
        const BG_STORAGE_KEY = 'os_bg_image_v1';

        function loadBackground() {
            const bgData = localStorage.getItem(BG_STORAGE_KEY);
            if (bgData) {
                document.body.style.backgroundImage = `url('${bgData}')`;
            } else {
                document.body.style.backgroundImage = 'none';
            }
        }

        function openBgModal() {
            document.getElementById('bgModal').style.display = 'flex';
        }

        function closeBgModal() {
            document.getElementById('bgModal').style.display = 'none';
            document.getElementById('bgUrlInput').value = '';
        }

        function saveBgUrl() {
            const url = document.getElementById('bgUrlInput').value.trim();
            if (url) applyAndSaveBg(url);
        }

        function handleBgFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                applyAndSaveBg(e.target.result);
            };
            reader.readAsDataURL(file);
            event.target.value = ''; // Reset
        }

        function applyAndSaveBg(dataString) {
            try {
                localStorage.setItem(BG_STORAGE_KEY, dataString);
                loadBackground();
                closeBgModal();
            } catch (e) {
                alert("Fehler! Das Bild ist möglicherweise zu groß für den lokalen Speicher (Limit ca. 5MB). Bitte nutze ein kleineres Bild oder eine URL.");
            }
        }

        function removeBackground() {
            localStorage.removeItem(BG_STORAGE_KEY);
            loadBackground();
            closeBgModal();
        }

        // Hintergrund beim Start laden
        loadBackground();


        // --- DATEI-EXPLORER LOGIK ---
        function loadFiles() {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = '';
            
            let rawFiles = localStorage.getItem('os_vfs_v1');
            let allFiles = rawFiles ? JSON.parse(rawFiles) : [];
            const folderFiles = allFiles.filter(f => f.folder === currentFolder);

            folderFiles.forEach(f => {
                const card = document.createElement('div');
                card.className = 'file-card';
                card.ondblclick = () => openFile(f.id); // Placeholder for openFile function

                let previewHTML = (f.type === 'image' || (f.content && f.content.startsWith('data:image')))
                    ? `<div class="file-preview"><img src="${f.content}" alt="Vorschau" loading="lazy"></div>`
                    : `<div class="file-preview text-preview">${(f.content || '').replace(/<[^>]*>?/gm, '').substring(0, 120)}</div>`;

                card.innerHTML = `
                    ${previewHTML}
                    <div class="file-name" title="${f.name}">${f.name}</div>
                    <div class="file-actions">
                        <button class="file-btn" onclick="event.stopPropagation(); downloadFile('${f.id}')" title="Download">⬇️</button>
                        <button class="file-btn del" onclick="event.stopPropagation(); deleteFile('${f.id}')" title="Löschen">✕</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setFolder(folder) {
            currentFolder = folder;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${folder}`).classList.add('active');
            
            const folderNames = { 'desktop': '🖥️ Desktop', 'documents': '📁 Dokumente', 'images': '🖼️ Bilder' };
            document.getElementById('currentFolderName').innerText = folderNames[folder];
            
            loadFiles();
        }

        /* --- DELETE EVERYTHING LOGIK (3 PASSEINGABEN) --- */
        let currentDeleteStep = 1;
        let enteredPass1 = "", enteredPass2 = "", enteredPass3 = "";

        function openDeleteEverythingModal() {
            currentDeleteStep = 1;
            enteredPass1 = ""; enteredPass2 = ""; enteredPass3 = "";
            updateDeleteModalUI();
            document.getElementById('deleteModal').style.display = 'flex';
            document.getElementById('deletePasswordInput').focus();
        }

        function closeDeleteEverythingModal() {
            document.getElementById('deleteModal').style.display = 'none';
            document.getElementById('deletePasswordInput').value = '';
        }

        function updateDeleteModalUI() {
            const badge = document.getElementById('deleteStepBadge');
            const prompt = document.getElementById('deletePromptText');
            const btn = document.getElementById('deleteConfirmBtn');
            const input = document.getElementById('deletePasswordInput');
            input.value = '';

            if (currentDeleteStep === 1) {
                badge.textContent = "1 / 3";
                prompt.textContent = "Schritt 1: Gib dein Passwort ein, um die Zurücksetzung einzuleiten.";
                btn.textContent = "Weiter (1/3)";
                btn.style.background = "#ef4444";
            } else if (currentDeleteStep === 2) {
                badge.textContent = "2 / 3";
                prompt.textContent = "Schritt 2: Gib dein Passwort zur Bestätigung EIN ZWEITES MAL ein.";
                btn.textContent = "Bestätigen (2/3)";
                btn.style.background = "#dc2626";
            } else if (currentDeleteStep === 3) {
                badge.textContent = "3 / 3";
                prompt.textContent = "⚠️ LETZTE WARNUNG! Gib dein Passwort EIN DRITTES MAL ein, um ALLES unwiderruflich zu löschen.";
                btn.textContent = "🔥 ALLES LÖSCHEN";
                btn.style.background = "#b91c1c";
            }
        }

        function processDeleteStep() {
            const val = document.getElementById('deletePasswordInput').value;
            if (!val || val.trim() === '') {
                alert('Bitte gib ein Passwort ein!');
                return;
            }

            if (currentDeleteStep === 1) {
                enteredPass1 = val;
                currentDeleteStep = 2;
                updateDeleteModalUI();
            } else if (currentDeleteStep === 2) {
                if (val !== enteredPass1) {
                    alert('❌ Die Passwörter stimmen nicht überein! Vorgang abgebrochen.');
                    closeDeleteEverythingModal();
                    return;
                }
                enteredPass2 = val;
                currentDeleteStep = 3;
                updateDeleteModalUI();
            } else if (currentDeleteStep === 3) {
                if (val !== enteredPass1) {
                    alert('❌ Die Passwörter stimmen nicht überein! Vorgang abgebrochen.');
                    closeDeleteEverythingModal();
                    return;
                }
                enteredPass3 = val;
                executeDeleteEverything();
            }
        }

        function executeDeleteEverything() {
            localStorage.clear(); // Löscht auch das gespeicherte Hintergrundbild
            const req = indexedDB.deleteDatabase('DesktopOS_DB_v3');
            req.onsuccess = req.onerror = req.onblocked = () => {
                setTimeout(() => {
                    alert('🔥 Sämtliche Notizen, Dateien und Speicherdaten wurden erfolgreich gelöscht!');
                    location.reload(); // Lädt die Seite neu (und setzt den Hintergrund zurück)
                }, 400);
            };
        }

        loadFiles();
    </script>
</body>
</html>
