<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Notizen</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 2rem 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .note-form {
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .note-form input, 
        .note-form textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text);
            font-size: 1rem;
        }

        .note-form textarea {
            resize: vertical;
            min-height: 100px;
        }

        .note-form button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .note-form button:hover {
            background-color: var(--accent-hover);
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .note-card {
            background-color: var(--card-bg);
            padding: 1.25rem;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            word-wrap: break-word;
        }

        .note-card h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .note-card p {
            color: var(--text-muted);
            white-space: pre-wrap;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .note-card .delete-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            align-self: flex-end;
            transition: background-color 0.2s;
        }

        .note-card .delete-btn:hover {
            background-color: var(--danger-hover);
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <header>
        <h1>📝 Meine Notizen</h1>
    </header>

    <form class="note-form" id="noteForm">
        <input type="text" id="noteTitle" placeholder="Titel der Notiz..." required>
        <textarea id="noteContent" placeholder="Notiz schreiben..." required></textarea>
        <button type="submit">Notiz speichern</button>
    </form>

    <div class="notes-grid" id="notesContainer"></div>

    <script>
        const noteForm = document.getElementById('noteForm');
        const noteTitle = document.getElementById('noteTitle');
        const noteContent = document.getElementById('noteContent');
        const notesContainer = document.getElementById('notesContainer');

        // Notizen aus dem Speicher des Browsers laden
        let notes = JSON.parse(localStorage.getItem('my_notes')) || [];

        function renderNotes() {
            notesContainer.innerHTML = '';

            if (notes.length === 0) {
                notesContainer.innerHTML = '<p class="empty-state">Noch keine Notizen vorhanden.</p>';
                return;
            }

            notes.forEach((note, index) => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <div>
                        <h3>${escapeHtml(note.title)}</h3>
                        <p>${escapeHtml(note.content)}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteNote(${index})">Löschen</button>
                `;
                notesContainer.appendChild(card);
            });
        }

        noteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newNote = {
                title: noteTitle.value.trim(),
                content: noteContent.value.trim()
            };

            notes.unshift(newNote);
            saveAndRender();

            noteTitle.value = '';
            noteContent.value = '';
        });

        function deleteNote(index) {
            notes.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('my_notes', JSON.stringify(notes));
            renderNotes();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        renderNotes();
    </script>
</body>
</html>
